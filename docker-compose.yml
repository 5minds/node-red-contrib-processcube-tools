services:
  node-red:
    image: 5minds/node-red:node-red-contrib-processcube-tools
    build:
      context: .
    ports:
      # node-red port
      - 1880:1880
      # debugger port
      - 9229:9229
    env_file:
      - .env
    environment:
      - TZ=Europe/Berlin
      # start node-red with debugger port open
      - NODE_OPTIONS=--inspect=0.0.0.0:9229
      #- NODE_OPTIONS=--inspect-brk=0.0.0.0:9229
      - NODE_ENV=development
    volumes:
      # save the flows
      - ./.processcube/nodered:/data
  greenmail:
    image: greenmail/standalone:latest
    ports:
      - "3025:3025"   # SMTP
      - "3143:3143"   # IMAP
    volumes:
      - ./src/test/data/email-preload:/email-preload
    environment:
      - GREENMAIL_OPTS=-Dgreenmail.hostname=0.0.0.0 -Dgreenmail.setup.test.all  -Dgreenmail.preload.dir=/email-preload
      #-Dgreenmail.users=test1:secret@local
    healthcheck:
      test: ["CMD", "sh", "-c", "nc -z localhost 3025 && nc -z localhost 3143"]
      interval: 3s
      timeout: 2s
      retries: 20


